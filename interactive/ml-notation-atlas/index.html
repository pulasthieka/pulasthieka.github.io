<style>
/* Layout: a reference atlas — sticky slim header, home = search hero over graph paper + symbol index; symbol & topic pages list equation cards; a right-side drawer reads one equation in depth. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #131a2a;
  --muted: #576178;
  --line: #dbe0e9;
  --grid: #e4e8f0;
  --accent: #2c45c4;
  --accent-ink: #ffffff;
  --accent-soft: #e6eafc;
  --mark: #ffe58a;
  --scrim: rgba(15, 20, 35, .38);
  --shadow: 0 18px 50px rgba(19, 26, 42, .18);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121a; --surface: #151b26; --ink: #e6eaf3; --muted: #9aa4b9; --line: #263042; --grid: #1a2130;
    --accent: #93a5ff; --accent-ink: #0e121a; --accent-soft: #1d2645; --mark: #5c4b12; --scrim: rgba(0,0,0,.55);
    --shadow: 0 18px 50px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #151b26; --ink: #e6eaf3; --muted: #9aa4b9; --line: #263042; --grid: #1a2130;
  --accent: #93a5ff; --accent-ink: #0e121a; --accent-soft: #1d2645; --mark: #5c4b12; --scrim: rgba(0,0,0,.55);
  --shadow: 0 18px 50px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.brand b { color: var(--accent); font-weight: 700; }
.top-search { margin-left: auto; flex: 0 1 320px; min-width: 0; }
.top-search input { width: 100%; }
.top nav { display: flex; gap: 4px; }
.navbtn { background: none; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 14px; text-decoration: none; }
.navbtn:hover { background: var(--accent-soft); color: var(--ink); }

input[type="search"] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; outline: none; }
input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* hero */
.hero { border-bottom: 1px solid var(--line); background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; background-position: -1px -1px; }
.hero .wrap { padding-block: 48px 40px; display: grid; gap: 18px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -.015em; margin: 0; }
.hero h1 { font-size: clamp(30px, 5vw, 50px); line-height: 1.05; font-weight: 700; max-width: 18ch; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lead { margin: 0; color: var(--muted); max-width: 60ch; font-size: 16px; }
.bigsearch { position: relative; max-width: 720px; }
.bigsearch input { width: 100%; font-size: 18px; padding: 16px 18px 16px 48px; border-radius: 12px; background: var(--surface); box-shadow: 0 2px 0 var(--line); }
.bigsearch svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.kbd { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.try { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; color: var(--ink); text-decoration: none; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip .g { font-family: var(--f-body); font-weight: 600; }
.stats { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* sections */
main { padding-block: 32px 64px; }
.section { display: grid; gap: 14px; margin-bottom: 40px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section h2 { font-size: 22px; font-weight: 700; }
.section .note { color: var(--muted); font-size: 13px; }

/* symbol tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.tile { display: grid; grid-template-rows: auto auto; gap: 2px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 10px; cursor: pointer; text-decoration: none; color: var(--ink); transition: border-color .12s, transform .12s; }
.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.tile .g { font-size: 30px; line-height: 1.15; height: 38px; display: flex; align-items: center; font-weight: 500; overflow: hidden; white-space: nowrap; }
.tile .g.small { font-size: 18px; font-family: var(--f-mono); }
.tile .n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .c { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* topic list */
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.topic { display: grid; gap: 4px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); }
.topic:hover { border-color: var(--accent); }
.topic h3 { font-size: 16px; font-weight: 700; }
.topic p { margin: 0; font-size: 13px; color: var(--muted); }
.topic .c { font-family: var(--f-mono); font-size: 11px; color: var(--accent); }

/* conventions */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.sym { font-size: 17px; white-space: nowrap; }

/* search results */
.results { display: grid; gap: 22px; }
.rgroup h3 { font-size: 13px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
.rlist { display: grid; gap: 6px; }
.rrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
.rrow:hover { border-color: var(--accent); }
.rrow .t { font-weight: 600; }
.rrow .tp { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.rrow .s { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); padding: 20px 0; }

/* page heads */
.phead { border-bottom: 1px solid var(--line); background: var(--surface); }
.phead .wrap { padding-block: 28px 24px; display: grid; gap: 10px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.symhead { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
.bigglyph { width: 112px; height: 112px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 60px; font-weight: 500; overflow: hidden; }
.bigglyph.small { font-size: 26px; font-family: var(--f-mono); }
.symhead h1 { font-size: clamp(26px, 4vw, 38px); }
.texline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
code { font-family: var(--f-mono); font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.copy { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
.copy:hover { color: var(--accent); border-color: var(--accent); }
.meanings { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: 75ch; }
.topic-lead { color: var(--muted); max-width: 65ch; margin: 0; }

/* equation cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.card { display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card .meta { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card h3 { font-size: 16px; font-weight: 700; }
.card .tp { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.card .f { overflow-x: auto; overflow-y: hidden; font-size: 13px; padding: 6px 0; min-width: 0; color: var(--ink); }
.card .s { color: var(--muted); font-size: 13.5px; margin: 0; }
.card .more { font-size: 13px; color: var(--accent); font-weight: 600; }
.grouphead { font-family: var(--f-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 50; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(105%); transition: transform .22s ease; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.on { transform: none; }
.dhead { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.dhead .ttl { flex: 1; min-width: 0; display: grid; gap: 4px; }
.dhead h2 { font-size: 21px; font-weight: 700; }
.iconbtn { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); }
.iconbtn:hover { color: var(--ink); border-color: var(--ink); }
.dbody { overflow-y: auto; overflow-x: hidden; padding: 18px 20px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-content: start; min-width: 0; }
.dsec { min-width: 0; }
.dformula { overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 12px; font-size: 15px; }
.dsec { display: grid; gap: 8px; }
.dsec h4 { margin: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.dsec p { margin: 0; max-width: 62ch; }
.where { display: grid; grid-template-columns: minmax(70px, auto) 1fr; gap: 6px 14px; align-items: baseline; font-size: 14px; }
.where dt { overflow-x: auto; }
.where dd { margin: 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dfoot { display: flex; justify-content: space-between; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }
.navpill { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navpill:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.navpill:disabled { opacity: .4; cursor: default; }
.src a { word-break: break-word; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity .15s; pointer-events: none; }
.toast.on { opacity: 1; }

mjx-container { color: inherit; }
mjx-container[display="true"] { margin: 0 !important; }
.f mjx-container, .dformula mjx-container { max-width: none; }
.f mjx-container[display="true"], .dformula mjx-container[display="true"] { text-align: left !important; }
.dformula mjx-container[display="true"] { display: inline-block !important; }

@media (max-width: 640px) {
  .top nav { display: none; }
  .top-search { flex: 1 1 auto; }
  .hero .wrap { padding-block: 32px 28px; }
  .symhead { grid-template-columns: 1fr; gap: 14px; }
  .bigglyph { width: 84px; height: 84px; font-size: 44px; }
  .cards { grid-template-columns: 1fr; }
  .drawer { width: 100%; border-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>


<style id="site-theme">

   serif headlines, mono metadata, one blue, square corners. */
:root {
  --bg: #f6f6f3; --surface: #ffffff; --ink: #0d0d0d; --muted: #62625e; --line: #c9c9c4; --grid: #e6e6e2;
  --accent: #00629b; --accent-ink: #ffffff; --accent-soft: #dcebf3; --mark: #ffe58a;
  --scrim: rgba(13, 13, 13, .4); --shadow: 0 18px 50px rgba(13, 13, 13, .18);
  --f-display: "Source Serif 4", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b19; --surface: #232321; --ink: #f0f0ec; --muted: #a3a39d; --line: #3a3a36; --grid: #232321;
    --accent: #6cbcea; --accent-ink: #0d0d0d; --accent-soft: #1d3442; --mark: #5c4b12;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 18px 50px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b19; --surface: #232321; --ink: #f0f0ec; --muted: #a3a39d; --line: #3a3a36; --grid: #232321;
  --accent: #6cbcea; --accent-ink: #0d0d0d; --accent-soft: #1d3442; --mark: #5c4b12;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 18px 50px rgba(0, 0, 0, .5);
}
body { background: var(--bg); }
h1, h2, h3 { font-weight: 700; letter-spacing: -.02em; }
.hero h1 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.08; }
.brand { font-family: var(--f-body); font-weight: 600; letter-spacing: -.03em; }
/* square corners everywhere, as on the site */
.tile, .card, .topic, .rrow, .chip, .kbd, code, .copy, .iconbtn, .navpill, .navbtn, .bigglyph, .dformula, .tablewrap,
.toast, mark, input[type="search"], .bigsearch input, :focus-visible { border-radius: 0 !important; }
.bigsearch input { box-shadow: none; border-color: var(--ink); }
.chip, .eyebrow, .stats, .tile .c, .card .tp, .rrow .tp, .grouphead, th { font-family: var(--f-mono); }
.chip { text-transform: uppercase; letter-spacing: .05em; font-size: 12px; padding: 4px 9px; }
.tile .c, .card .tp, .rrow .tp, .topic .c { font-size: 12px; }
.tile:hover { transform: none; }
.section-head { border-top: 3px solid var(--ink); padding-top: 12px; }
.section h2 { font-family: var(--f-body); font-weight: 600; font-size: 15px; letter-spacing: .02em; text-transform: uppercase; }
.card h3, .topic h3 { font-family: var(--f-body); font-weight: 600; letter-spacing: -.015em; }
.dhead h2 { font-family: var(--f-display); }
/* Inside the article the site already shows the title, so the atlas drops its own name */
html.embedded .brand { display: none; }
html.embedded .top .wrap { justify-content: flex-start; }
html.embedded .hero .wrap { padding-block: 30px 28px; }
@media (max-width: 640px) { html.embedded .top .wrap { padding-block: 3px; min-height: 0; } html.embedded .top:not(:has(#topSearchWrap:not([hidden]))) { display: none; } }
</style>

<script>
/* ML Notation Atlas — content data. tex strings use String.raw so backslashes stay literal. */
const R = String.raw;

const SOURCES = {
  gbc: { label: "Goodfellow, Bengio & Courville — Deep Learning, Notation", url: "https://book.huihoo.com/deep-learning/contents/notation.html" },
  cookbook: { label: "Petersen & Pedersen — The Matrix Cookbook", url: "https://www2.imm.dtu.dk/pubdb/pubs/3274-full.html" },
  rabiner: { label: "Rabiner (1989) — A Tutorial on Hidden Markov Models", url: "https://bibsonomy.org/bibtex/1cb553ab450ee9f15ab7aca585941f36a/kurtjx" },

  { id: "expected-risk", topic: "probability", title: "Expected risk and its empirical estimate",
    tex: R`\mathbb{E}_{(x,y)\sim p_{\text{data}}}\big[\ell(f_\theta(x), y)\big] \;\approx\; \frac{1}{N}\sum_{i=1}^{N}\ell\big(f_\theta(x_i), y_i\big)`,
