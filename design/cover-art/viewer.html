<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Traces — cover art viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #6b6962;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h2::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: var(--anthropic-dark);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #879b6b;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Latent Traces</h1>
            <div class="subtitle">Cover art for pulasthi.dev. A hidden field is disturbed by a few events; many channels write down what they saw.</div>

            <div class="control-section">
                <h2>Seed</h2>
                <input type="number" id="seed-input" class="seed-input" value="2310" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h2>Post presets</h2>
                <div class="control-group">
                    <select id="preset" class="seed-input" style="text-align:left;margin-bottom:0" onchange="applyPreset(this.value)"></select>
                </div>
            </div>

            <div class="control-section">
                <h2>Parameters</h2>
                <div class="control-group">
                    <label>Geometry</label>
                    <select id="mode" class="seed-input" style="text-align:left;margin-bottom:0" onchange="updateParam('mode', this.value)">
                        <option value="linear">Linear — one current</option>
                        <option value="radial">Radial — whirls</option>
                    </select>
                </div>
                <div class="control-group"><label>Line density</label><div class="slider-container">
                    <input type="range" id="channels" min="4" max="44" step="1" oninput="updateParam('channels', this.value)">
                    <span class="value-display" id="channels-value"></span></div></div>
                <div class="control-group"><label>Events (vortices)</label><div class="slider-container">
                    <input type="range" id="events" min="1" max="6" step="1" oninput="updateParam('events', this.value)">
                    <span class="value-display" id="events-value"></span></div></div>
                <div class="control-group"><label>Coupling (calm vs turbulent)</label><div class="slider-container">
                    <input type="range" id="coupling" min="0" max="1" step="0.05" oninput="updateParam('coupling', this.value)">
                    <span class="value-display" id="coupling-value"></span></div></div>
                <div class="control-group"><label>Quantize (0 = smooth)</label><div class="slider-container">
                    <input type="range" id="quantize" min="0" max="8" step="1" oninput="updateParam('quantize', this.value)">
                    <span class="value-display" id="quantize-value"></span></div></div>
                <div class="control-group"><label>Whirls (radial only)</label><div class="slider-container">
                    <input type="range" id="cells" min="1" max="3" step="1" oninput="updateParam('cells', this.value)">
                    <span class="value-display" id="cells-value"></span></div></div>
                <div class="control-group"><label>Accent lines</label><div class="slider-container">
                    <input type="range" id="accents" min="0" max="6" step="1" oninput="updateParam('accents', this.value)">
                    <span class="value-display" id="accents-value"></span></div></div>
            </div>

            <div class="control-section">
                <h2>Colors</h2>
                <div class="color-group"><label>Paper</label><div class="color-picker-container">
                    <input type="color" id="bg" onchange="updateColor('bg', this.value)"><span class="color-value" id="bg-value"></span></div></div>
                <div class="color-group"><label>Ink</label><div class="color-picker-container">
                    <input type="color" id="ink" onchange="updateColor('ink', this.value)"><span class="color-value" id="ink-value"></span></div></div>
                <div class="color-group"><label>Accent</label><div class="color-picker-container">
                    <input type="color" id="accent" onchange="updateColor('accent', this.value)"><span class="color-value" id="accent-value"></span></div></div>
                <button class="button secondary" onclick="toggleTheme()">Light / dark page</button>
            </div>

            <div class="control-section">
                <h2>Actions</h2>
                <div class="button-row" style="margin-bottom:8px">
                    <button class="button" onclick="initializeSystem()">Regenerate</button>
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" onclick="saveCanvas('latent-traces-' + params.seed, 'png')">Download PNG</button>
                <pre id="frontmatter" style="margin-top:16px;padding:12px;background:var(--anthropic-light);border:1px solid var(--anthropic-light-gray);border-radius:8px;font:12px/1.5 'Courier New',monospace;white-space:pre-wrap"></pre>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══ Core — a copy of src/lib/cover.js; paste it again after changing that file ═══
        // Latent Traces — the generative system behind the blog cover images.
        // Pure, dependency-free and seeded: the same options always give the same
        // drawing. Used at build time (src/pages/covers/[slug].svg.js) and inlined
        // into the interactive viewer (design/cover-art/viewer.html).
        // See design/cover-art/philosophy.md.

        const W = 1600;
        const H = 900;

        const defaults = {
          seed: 1,
          mode: 'linear', // 'linear' = one current across the page, 'radial' = 1-3 whirls
          channels: 22, // line density
          events: 2, // vortices that disturb the field
          coupling: 0.5, // 0 = turbulent, 1 = long calm currents
          quantize: 0, // 0 = smooth; 3..8 = lines snap to a few headings
          cells: 1, // radial only: number of whirls
          accents: 1, // lines drawn in the accent colour
        };

        function hashSeed(str) {
          let h = 2166136261;
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0) % 999983 + 1;
        }

        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // Seeded 2D value noise in [0, 1], smooth-stepped.
        function makeNoise(rand) {
          const perm = new Uint8Array(512);
          const vals = new Float32Array(256);
          for (let i = 0; i < 256; i++) {
            perm[i] = i;
            vals[i] = rand();
          }
          for (let i = 255; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            const t = perm[i];
            perm[i] = perm[j];
            perm[j] = t;
          }
          for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
          const at = (x, y) => vals[perm[(perm[x & 255] + y) & 255]];
          const fade = (t) => t * t * (3 - 2 * t);
          return function (x, y) {
            const xi = Math.floor(x);
            const yi = Math.floor(y);
            const u = fade(x - xi);
            const v = fade(y - yi);
            const a = at(xi, yi) + (at(xi + 1, yi) - at(xi, yi)) * u;
            const b = at(xi, yi + 1) + (at(xi + 1, yi + 1) - at(xi, yi + 1)) * u;
            return a + (b - a) * v;
          };
        }

        // A stimulus: sharp onset, slow recovery with a damped ripple.
        function response(d, onset, tau) {
          if (d < 0) return Math.exp(-(d * d) / (2 * onset * onset));
          return Math.exp(-d / tau) * (0.82 + 0.18 * Math.cos(d / (tau * 0.16)));
        }

        function generate(options) {
          const p = Object.assign({}, defaults, options);
          const rand = mulberry32(p.seed >>> 0);
          const noise = makeNoise(rand);
          const R = (a, b) => a + (b - a) * rand();
          const C = Math.max(3, Math.round(p.channels));
          const E = Math.max(1, Math.round(p.events));
          const q = Math.round(p.quantize);
          const coupling = Math.min(1, Math.max(0, p.coupling));
          const nAcc = Math.max(0, Math.round(p.accents));
          const radial = p.mode === 'radial';

          // The hidden field: domain-warped noise. Coupling smooths it out.
          const f = 0.0042 + (0.0016 - 0.0042) * coupling;
          const warp = 260 * (1 - 0.5 * coupling);
          const base = (x, y) => {
            const wx = x + warp * (noise(x * f * 0.7 + 11, y * f * 0.7) - 0.5);
            const wy = y + warp * (noise(x * f * 0.7, y * f * 0.7 + 23) - 0.5);
            return (noise(wx * f, wy * f) - 0.5) * Math.PI * (radial ? 2.4 : 1.9) + (noise(wx * f * 3, wy * f * 3 + 7) - 0.5) * 0.9;
          };

          // Linear: one current running across the page. Radial: 1-3 slow whirls.
          const ncells = radial ? Math.min(3, Math.max(1, Math.round(p.cells))) : 0;
          const cells = [];
          for (let i = 0; i < ncells; i++) {
            cells.push({ x: W * ((i + 0.5) / ncells + R(-0.06, 0.06)), y: H * R(0.38, 0.62), s: R(0.8, 1.2) * H * 0.42, dir: rand() < 0.5 ? -1 : 1 });
          }

          // Stimuli are vortices: a sharp rise near the core, then a long, rippling recovery outward.
          const events = [];
          for (let e = 0; e < E; e++) {
            events.push({
              x: W * (0.12 + ((e + R(0.2, 0.8)) / E) * 0.76),
              y: H * R(0.22, 0.78),
              s: R(110, 230),
              amp: R(2.2, 3.6),
              dir: rand() < 0.5 ? -1 : 1,
            });
          }

          const angle = (x, y) => {
            const a = base(x, y);
            let vx = Math.cos(a);
            let vy = Math.sin(a);
            for (const c of cells) {
              const dx = x - c.x;
              const dy = y - c.y;
              const w = 1.6 * Math.exp(-(dx * dx + dy * dy) / (2 * c.s * c.s));
              const r = Math.hypot(dx, dy) || 1;
              vx += (-dy / r) * c.dir * w;
              vy += (dx / r) * c.dir * w;
            }
            for (const ev of events) {
              const dx = x - ev.x;
              const dy = y - ev.y;
              const r = Math.hypot(dx, dy) || 1;
              const g = ev.amp * response((r - ev.s * 0.3) / ev.s, 0.12, 0.7);
              vx += (-dy / r) * ev.dir * g;
              vy += (dx / r) * ev.dir * g;
            }
            let th = Math.atan2(vy, vx);
            if (q > 0) th = Math.round(th / (Math.PI / q)) * (Math.PI / q); // sampled and held: only a few headings
            return th;
          };

          // Evenly spaced streamlines (Jobard and Lefer): a line starts only where there is room
          // and stops when it comes too close to another one.
          const dsep = Math.max(9, 280 / C);
          const dtest = dsep * 0.55;
          const step = 3;
          const gw = Math.ceil(W / dsep) + 3;
          const grid = new Map();
          const key = (x, y) => (Math.floor(y / dsep) + 1) * gw + Math.floor(x / dsep) + 1;
          const free = (x, y, d, id) => {
            const cx = Math.floor(x / dsep) + 1;
            const cy = Math.floor(y / dsep) + 1;
            for (let j = cy - 1; j <= cy + 1; j++) {
              for (let i = cx - 1; i <= cx + 1; i++) {
                const bucket = grid.get(j * gw + i);
                if (!bucket) continue;
                for (const pt of bucket) if (pt[2] !== id && (pt[0] - x) ** 2 + (pt[1] - y) ** 2 < d * d) return false;
              }
            }
            return true;
          };
          const inside = (x, y) => x > -30 && x < W + 30 && y > -30 && y < H + 30;
          const half = (x, y, sign, id) => {
            const pts = [];
            for (let i = 0; i < 700; i++) {
              const th = angle(x, y);
              x += sign * step * Math.cos(th);
              y += sign * step * Math.sin(th);
              if (!inside(x, y) || !free(x, y, dtest, id)) break;
              pts.push([x, y]);
            }
            return pts;
          };

          const lines = [];
          const add = (x, y, accent) => {
            if (!inside(x, y) || !free(x, y, dsep, -1)) return;
            const id = lines.length;
            const pts = [...half(x, y, -1, id).reverse(), [x, y], ...half(x, y, 1, id)];
            if (pts.length < 12) return;
            for (const pt of pts) {
              const k = key(pt[0], pt[1]);
              if (!grid.has(k)) grid.set(k, []);
              grid.get(k).push([pt[0], pt[1], id]);
            }
            lines.push({ pts, accent });
          };

          // Accent lines go first, threaded through the stimuli, so they always exist.
          for (let j = 0; j < nAcc; j++) {
            const ev = events[j % E];
            const t = (j / nAcc) * Math.PI * 2 + R(0, 1);
            add(ev.x + Math.cos(t) * ev.s * 0.45, ev.y + Math.sin(t) * ev.s * 0.45, true);
          }
          const seeds = [];
          for (let y = dsep / 2; y < H; y += dsep) for (let x = dsep / 2; x < W; x += dsep) seeds.push([x + R(-0.4, 0.4) * dsep, y + R(-0.4, 0.4) * dsep]);
          for (let i = seeds.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            [seeds[i], seeds[j]] = [seeds[j], seeds[i]];
          }
          for (const [x, y] of seeds) add(x, y, false);

          // Lines fade with distance from the nearest stimulus, so depth comes from the events.
          const near = (x, y) => Math.max(...events.map((ev) => Math.exp(-((x - ev.x) ** 2 + (y - ev.y) ** 2) / (2 * (ev.s * 2.2) ** 2))));
          const shapes = lines.map((l) => {
            const m = l.pts[l.pts.length >> 1];
            return { pts: l.pts, accent: l.accent, fade: l.accent ? 1 : 0.3 + 0.7 * near(m[0], m[1]) };
          });
          const marks = events.map((ev) => [ev.x, ev.y, ev.s * 0.3]);
          const dots = events.map((ev) => [ev.x, ev.y]);
          return { shapes, marks, dots };
        }

        const palette = {
          light: { bg: '#e4e4e0', ink: '#0d0d0d', accent: '#00629b' },
          dark: { bg: '#232321', ink: '#f0f0ec', accent: '#6cbcea' },
        };

        // Standalone SVG. Colours follow the viewer's light/dark preference, so the
        // same file works in both themes when used as an <img>.
        // `weight` scales stroke, dash and dot sizes (thumbnails use a heavier line).
        function renderSVG(options, weight = 1) {
          const { shapes, marks, dots } = generate(options);
          const n = (v) => Math.round(v);
          const { light, dark } = palette;
          let out =
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">` +
            `<style>.b{fill:${light.bg}}.l,.m{fill:none;stroke:${light.ink};stroke-width:${1.3 * weight};stroke-linecap:round;stroke-linejoin:round}` +
            `.a{stroke:${light.accent};stroke-width:${2.8 * weight}}.m{stroke-width:${weight};stroke-opacity:.45;stroke-dasharray:${2 * weight} ${7 * weight}}` +
            `.d{fill:${light.accent}}@media(prefers-color-scheme:dark){.b{fill:${dark.bg}}.l,.m{stroke:${dark.ink}}` +
            `.a{stroke:${dark.accent}}.d{fill:${dark.accent}}}</style><rect class="b" width="${W}" height="${H}"/>`;
          const ordered = [...shapes.filter((s) => !s.accent), ...shapes.filter((s) => s.accent)];
          for (const s of ordered) {
            // every third traced point is plenty at this size and keeps the file small
            const pts = s.pts.filter((_, i) => i % 3 === 0 || i === s.pts.length - 1);
            const d = 'M' + pts.map((pt) => `${n(pt[0])} ${n(pt[1])}`).join('L');
            const o = s.fade < 0.95 ? ` stroke-opacity="${s.fade.toFixed(2)}"` : '';
            out += `<path class="l${s.accent ? ' a' : ''}"${o} d="${d}"/>`;
          }
          for (const m of marks) out += `<circle class="m" cx="${n(m[0])}" cy="${n(m[1])}" r="${n(m[2])}"/>`;
          for (const pt of dots) out += `<circle class="d" cx="${n(pt[0])}" cy="${n(pt[1])}" r="${7 * weight}"/>`;
          return out + '</svg>';
        }

        /** Cover options for a post: explicit `cover` frontmatter over a slug-derived default. */
        function coverOptions(slug, cover) {
          const seed = hashSeed(slug);
          const auto = {
            seed,
            mode: seed % 3 === 0 ? 'radial' : 'linear',
            channels: 14 + (seed % 13),
            events: 1 + (seed % 3),
            coupling: 0.3 + ((seed % 50) / 100),
          };
          return Object.assign({}, defaults, auto, cover || {});
        }

        // ═══ Parameters ════════════════════════════════════════════════════════
        const PRESETS = {
            'semantic-decoding': { seed: 2310, mode: 'linear', channels: 30, events: 4, coupling: 0.25 },
            'estimating-osteaarthritis': { seed: 2412, mode: 'radial', cells: 1, channels: 22, events: 2, coupling: 0.8 },
            'explainable-ai': { seed: 2305, mode: 'radial', cells: 2, channels: 13, events: 2, coupling: 0.6 },
            'setup-webserver': { seed: 2201, mode: 'linear', channels: 12, events: 2, coupling: 0.7, quantize: 5 },
            'commands': { seed: 2202, mode: 'linear', channels: 8, events: 3, coupling: 0.3, quantize: 3 },
            'what-endo-mass-measures (draft)': { seed: 2608, mode: 'linear', channels: 16, events: 1, coupling: 0.85, accents: 4 }
        };
        const SLIDERS = ['channels', 'events', 'coupling', 'quantize', 'cells', 'accents'];
        const COLORS = ['bg', 'ink', 'accent'];

        let params = Object.assign({}, defaults, PRESETS['semantic-decoding'], palette.light);
        let defaultParams = {...params};
        let theme = 'light';

        // ═══ p5.js ═════════════════════════════════════════════════════════════
        function setup() {
            let canvas = createCanvas(W, H);
            canvas.parent('canvas-container');
            noLoop();
            document.querySelector('.loading').style.display = 'none';
            const sel = document.getElementById('preset');
            Object.keys(PRESETS).forEach(k => sel.add(new Option(k, k)));
            syncUI();
            initializeSystem();
        }

        function initializeSystem() { redraw(); }

        function draw() {
            const model = generate(params);
            background(params.bg);
            strokeJoin(ROUND);
            noFill();
            strokeCap(ROUND);
            const shapes = [...model.shapes.filter(s => !s.accent), ...model.shapes.filter(s => s.accent)];
            for (const s of shapes) {
                const c = color(s.accent ? params.accent : params.ink);
                c.setAlpha(255 * s.fade);
                stroke(c);
                strokeWeight(s.accent ? 2.8 : 1.3);
                beginShape();
                for (const pt of s.pts) vertex(pt[0], pt[1]);
                endShape();
            }
            const ink = color(params.ink); ink.setAlpha(115);
            stroke(ink); strokeWeight(1);
            drawingContext.setLineDash([2, 7]);
            for (const m of model.marks) circle(m[0], m[1], m[2] * 2);
            drawingContext.setLineDash([]);
            noStroke(); fill(params.accent);
            for (const d of model.dots) circle(d[0], d[1], 14);
            showFrontmatter();
        }

        function showFrontmatter() {
            const keys = ['seed', 'mode', 'channels', 'events', 'coupling', 'quantize', 'cells', 'accents'];
            document.getElementById('frontmatter').textContent =
                'cover:\n' + keys.map(k => '  ' + k + ': ' + params[k]).join('\n');
        }

        // ═══ UI handlers ═══════════════════════════════════════════════════════
        function syncUI() {
            document.getElementById('seed-input').value = params.seed;
            document.getElementById('mode').value = params.mode;
            SLIDERS.forEach(id => {
                document.getElementById(id).value = params[id];
                document.getElementById(id + '-value').textContent = params[id];
            });
            COLORS.forEach(id => {
                document.getElementById(id).value = params[id];
                document.getElementById(id + '-value').textContent = params[id];
            });
        }

        function updateParam(paramName, value) {
            params[paramName] = paramName === 'mode' ? value : parseFloat(value);
            if (paramName !== 'mode') document.getElementById(paramName + '-value').textContent = value;
            initializeSystem();
        }

        function updateColor(colorId, value) {
            params[colorId] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
        }

        function toggleTheme() {
            theme = theme === 'light' ? 'dark' : 'light';
            Object.assign(params, palette[theme]);
            syncUI();
            initializeSystem();
        }

        function applyPreset(name) {
            params = Object.assign({}, defaults, PRESETS[name], palette[theme]);
            syncUI();
            initializeSystem();
        }

        // ═══ Seed controls ═════════════════════════════════════════════════════
        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }

        function updateSeed() {
            let newSeed = parseInt(document.getElementById('seed-input').value);
            if (newSeed && newSeed > 0) { params.seed = newSeed; initializeSystem(); }
            else updateSeedDisplay();
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed = params.seed + 1; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); }

        function resetParameters() {
            theme = 'light';
            params = {...defaultParams};
            document.getElementById('preset').selectedIndex = 0;
            syncUI();
            initializeSystem();
        }
    </script>
</body>
</html>
